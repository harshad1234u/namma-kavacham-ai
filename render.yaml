# Render Blueprint. Secrets and deployment URLs use `sync: false`: Render asks for them in the
# dashboard when the Blueprint is created, so no value is stored in this repository.
services:
  - type: web
    name: namma-kavacham-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      # Exactly the frontend origin, e.g. https://<frontend>.onrender.com (no trailing slash, no path).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_ENABLED
        value: "false"
      - key: VIRUSTOTAL_ENABLED
        value: "false"
      - key: VIRUSTOTAL_API_KEY
        sync: false
      # CivicInsight scheme + development AI (NVIDIA NIM). Off until AI_ENABLED=true and a key is set;
      # everything has a deterministic fallback. Check connectivity with: python scripts/check_nim.py
      - key: AI_ENABLED
        value: "false"
      - key: NVIDIA_NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_NIM_API_KEY
        sync: false
      # Optional separate key for the embedding model (falls back to NVIDIA_NIM_API_KEY).
      - key: NVIDIA_NIM_EMBEDDING_API_KEY
        sync: false
      - key: NVIDIA_NIM_SARVAM_MODEL
        value: sarvamai/sarvam-m
      - key: NVIDIA_NIM_EMBEDDING_MODEL
        value: nvidia/nemotron-3-embed-1b

  - type: web
    name: namma-kavacham-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Backend URL, e.g. https://<backend>.onrender.com. Read at build time: redeploy after changing it.
      - key: VITE_API_BASE_URL
        sync: false
